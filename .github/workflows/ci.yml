name: LUMAREEL CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'fix/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run lint
      - run: bun run lint:security
      - run: bun run test
      - run: bun run build
